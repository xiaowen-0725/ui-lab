name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and validate registry
        run: bun run check

      - name: Accessibility tests
        # Root suite only — greenfield lives in benchmarks/runs/* with its own toolchain.
        # Use ./tests (not "tests") so bun does not also match nested **/tests paths.
        run: bun test ./tests
